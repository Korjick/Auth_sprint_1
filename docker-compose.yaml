services:
  auth_api_migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "auth_api.cmd.app.main", "db", "upgrade"]

  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OTEL_ENABLED: True
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_ENVIRONMENT: production
    command: ["python", "-m", "auth_api.cmd.app.main", "service", "run", "--host", "0.0.0.0", "--port", "8080"]
    expose:
      - "8080"
      - "50051"
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      auth_api_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PG_PARTMAN_BGW_DBNAME: ${POSTGRES_DB:-auth}
        PG_PARTMAN_BGW_INTERVAL: ${PG_PARTMAN_BGW_INTERVAL:-3600}
        PG_PARTMAN_BGW_ROLE: ${POSTGRES_USER:-postgres}
    image: auth_api-postgres:18-partman
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8.2.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/usr/share/redis/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:3.7.1
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  loki_data:
